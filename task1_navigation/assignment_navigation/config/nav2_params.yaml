amcl:
  ros__parameters:
    use_sim_time: true

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map

    scan_topic: /scan

    laser_min_range: 0.12
    laser_max_range: 12.0

    min_particles: 500
    max_particles: 2000

    set_initial_pose: true

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0


map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""


planner_server:
  ros__parameters:
    use_sim_time: true

    expected_planner_frequency: 5.0

    planner_plugins:
      - GridBased

    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: true


controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugins:
      - progress_checker

    goal_checker_plugins:
      - goal_checker

    controller_plugins:
      - FollowPath

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 20.0

    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20
      stateful: true

    FollowPath:
      plugin: dwb_core::DWBLocalPlanner

      debug_trajectory_details: true

      min_vel_x: 0.0
      max_vel_x: 0.25

      min_vel_y: 0.0
      max_vel_y: 0.0

      min_vel_theta: -0.8
      max_vel_theta: 0.8

      min_speed_xy: 0.0
      max_speed_xy: 0.25

      min_speed_theta: 0.0
      max_speed_theta: 0.8

      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0

      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0

      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20

      sim_time: 1.5

      linear_granularity: 0.05
      angular_granularity: 0.025

      critics:
        - Oscillation
        - ObstacleFootprint
        - PathAlign
        - GoalAlign
        - PathDist
        - GoalDist


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: map
      robot_base_frame: base_footprint

      update_frequency: 3.0
      publish_frequency: 2.0

      resolution: 0.05

      track_unknown_space: true

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer

        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true

          obstacle_min_range: 0.12
          obstacle_max_range: 3.0

          raytrace_min_range: 0.12
          raytrace_max_range: 3.5

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.35


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: odom
      robot_base_frame: base_footprint

      update_frequency: 5.0
      publish_frequency: 2.0

      rolling_window: true

      width: 4
      height: 4
      resolution: 0.05

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer

        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true

          min_obstacle_height: 0.0
          max_obstacle_height: 0.5

          obstacle_min_range: 0.12
          obstacle_max_range: 3.0

          raytrace_min_range: 0.12
          raytrace_max_range: 3.5

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
